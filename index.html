<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kitchen Hands - حلول عملية لحفظ ونقل الطعام للمطابخ المنزلية والصناعية." />
  <meta name="theme-color" content="#111111" />
  <title>Kitchen Hands | كتشن هاندس</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero" aria-label="Kitchen Hands">
    <img
      class="hero-image"
      src="kitchen-hands-hero.png"
      alt="Kitchen Hands - كتشن هاندس، حلول عملية لحفظ ونقل الطعام للمطابخ المنزلية والصناعية"
    />

    <div class="bottom-bar">
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span>قريباً</span>
      </div>

      <div class="actions">
        <a
          class="btn btn-light"
          href="https://www.google.com/maps/search/?api=1&query=Istanbul%2C%20Turkey"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="الموقع: إسطنبول، تركيا"
        >
          <span class="icon" aria-hidden="true">⌖</span>
          <span>إسطنبول، تركيا</span>
        </a>

        <a
          class="btn btn-dark"
          href="https://wa.me/905364553111"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="تواصل معنا على واتساب"
        >
          <span class="icon" aria-hidden="true">◉</span>
          <span dir="ltr">+90 536 455 31 11</span>
          <span class="arrow" aria-hidden="true">←</span>
        </a>
      </div>
    </div>
  </main>
